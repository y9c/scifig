[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scifig"
version = "0.1.0"
description = "Publication-ready matplotlib figures with your preferred style + pure-Python compose/annotate helpers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "yec" }]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "cycler>=0.11",
]

[project.optional-dependencies]
dev = ["scipy>=1.7"]

[tool.setuptools]
packages = ["scifig"]

[tool.setuptools.package-data]
scifig = ["assets/*.mplstyle"]
